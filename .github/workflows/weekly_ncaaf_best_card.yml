name: Weekly NCAAF Top 25 Best Card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly_ncaaf_best_card.yml"
  schedule:
    # First Friday attempt at 1:50 AM Pacific during daylight time.
    # Additional attempts cover delayed GitHub scheduled runs.
    - cron: "50 8 * * 5"
    - cron: "50 10 * * 5"
    - cron: "50 11 * * 5"
    - cron: "50 13 * * 5"
    - cron: "50 15 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/457900160143/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: mlb-hr-model@mlb-hr-model-498322.iam.gserviceaccount.com
      - name: Publish NCAAF Best Card
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python run_weekly_ncaaf_best_card.py
