name: Monday NCAAF Best Card Results

on:
  schedule:
    - cron: "50 11 * * 1"
    - cron: "50 13 * * 1"
    - cron: "50 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/457900160143/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: mlb-hr-model@mlb-hr-model-498322.iam.gserviceaccount.com
      - name: Publish NCAAF results
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python run_monday_ncaaf_results.py
